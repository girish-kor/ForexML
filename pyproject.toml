[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forexml"
version = "0.1.0"
description = "Forex Machine Learning Trading System"
authors = [
    { name = "Girish", email = "your.email@example.com" }
]
dependencies = [
    "MetaTrader5",
    "numpy>=2.0.0,<2.3.0",
    "pandas<3.0.0",
    "scikit-learn<1.9.0",
    "scipy",
    "lightgbm",
    "pytorch-tabnet",
    "joblib",
    "imbalanced-learn",
    "pyarrow>=24.0.0"
]
requires-python = ">=3.8"

[project.scripts]
forexml = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]
